[platformio]
default_envs = control_esp32

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM27
monitor_port = COM27
monitor_rts = 0
monitor_dtr = 0
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter = +<capture.cpp> -<control.cpp>

[env:control_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM35
monitor_port = COM35
build_src_filter = +<control.cpp> -<capture.cpp>